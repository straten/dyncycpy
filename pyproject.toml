[tool.poetry]
name = "pycyc"
version = "0.1.0"
description = ""
authors = ["Stefan Oslowski <stefan.oslowski@manlyastrophysics.org>"]

[tool.poetry.dependencies]
python = "3.10.11"
numpy = "^1.23.4"
scipy = "^1.9.3"
matplotlib = "^3.6.2"
jupyter = "^1.0.0"
jupyter-contrib-nbextensions = "^0.7.0"
importlib-resources = "^5.12.0"
flake8 = "^6.1.0"
# Optional GPU backend (see /home/willem/.claude/plans/stateful-dreaming-wall.md,
# pycyc/backend.py, CyclicSolver.use_gpu): not a hard dependency -- pycyc
# imports and works with no GPU/cupy present. cupy-cuda12x matches the
# CUDA 12.x driver this was developed/verified against; pick the package
# matching your own CUDA version if different (e.g. cupy-cuda11x) -- see
# https://docs.cupy.dev/en/stable/install.html.
cupy-cuda12x = {version = "^13.6.0", optional = true}

[tool.poetry.extras]
gpu = ["cupy-cuda12x"]

[tool.poetry.dev-dependencies]
black = "^22.10.0"
pytest = "^7.4.4"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
